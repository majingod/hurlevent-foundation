name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Typecheck AVANT vitest (échec rapide). Dans le MÊME job « vitest »
      # exprès : le status check requis du ruleset le couvre sans geste UI.
      - run: pnpm --dir artifacts/arlor run typecheck
      - run: pnpm --dir artifacts/arlor exec vitest run
